# Redis Configuration for TAJIRI Livestreaming
#
# Optimized for low-latency stream metadata and real-time data
# Copy to /etc/redis/redis.conf or include in existing config
#
# Key patterns used:
# - stream:meta:{id}     - Stream metadata (TTL: 5 min)
# - stream:viewers:{id}  - Current viewer count (TTL: 1 min)
# - stream:peak:{id}     - Peak viewers (TTL: 24 hours)
# - stream:comments:{id} - Recent comments list (TTL: 1 hour)
# - stream:health:{id}   - Health metrics (TTL: 1 min)
# - streams:active       - Set of active stream IDs
# - session:{uid}:{sid}  - User viewing sessions (TTL: 1 hour)
# - rate:{action}:{uid}  - Rate limiting counters (TTL: 1 min)
# - battle:{id}:score:{sid} - Battle scores (TTL: 1 hour)

# =============================================================================
# NETWORK
# =============================================================================
bind 127.0.0.1 ::1
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# =============================================================================
# GENERAL
# =============================================================================
daemonize yes
supervised systemd
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================
# Max memory for Redis (adjust based on server RAM)
maxmemory 512mb

# Eviction policy: Remove least recently used keys with TTL
# This is ideal for our caching use case
maxmemory-policy volatile-lru

# Sample size for LRU algorithm (higher = more accurate but slower)
maxmemory-samples 5

# =============================================================================
# PERSISTENCE (Disable for pure caching / Enable for durability)
# =============================================================================
# For livestreaming cache, we can disable persistence as data is transient
# Uncomment RDB settings below for persistence

# Disable RDB snapshots (faster, less disk I/O)
save ""

# Or enable with these settings for persistence:
# save 900 1      # Save after 900 seconds if at least 1 key changed
# save 300 10     # Save after 300 seconds if at least 10 keys changed
# save 60 10000   # Save after 60 seconds if at least 10000 keys changed

# RDB settings
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# Disable AOF (faster writes)
appendonly no

# Or enable for better durability:
# appendonly yes
# appendfsync everysec
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# =============================================================================
# PERFORMANCE OPTIMIZATIONS
# =============================================================================
# Lazy freeing - async delete large objects
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Active defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# =============================================================================
# PUBSUB (for WebSocket broadcasting)
# =============================================================================
# Increase pubsub memory limit for livestreaming
# client-output-buffer-limit pubsub 64mb 16mb 120

# =============================================================================
# SECURITY
# =============================================================================
# Require password (recommended for production)
# requirepass your_strong_password_here

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# =============================================================================
# SLOW LOG
# =============================================================================
slowlog-log-slower-than 10000
slowlog-max-len 128

# =============================================================================
# LATENCY MONITORING
# =============================================================================
latency-monitor-threshold 100

# =============================================================================
# CLUSTER (if using Redis Cluster)
# =============================================================================
# cluster-enabled no
# cluster-config-file nodes.conf
# cluster-node-timeout 5000
