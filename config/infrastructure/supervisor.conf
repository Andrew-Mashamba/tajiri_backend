; Supervisor configuration for TAJIRI Livestreaming
;
; Installation:
; 1. Install supervisor: apt install supervisor
; 2. Copy to /etc/supervisor/conf.d/tajiri.conf
; 3. Create log directory: mkdir -p /var/log/tajiri
; 4. Reload: supervisorctl reread && supervisorctl update
; 5. Start all: supervisorctl start tajiri:*
;
; Commands:
; - supervisorctl status tajiri:*
; - supervisorctl restart tajiri:*
; - supervisorctl tail -f tajiri:laravel-worker

[group:tajiri]
programs=laravel-worker,laravel-schedule,websocket-server,stream-health-monitor

; =============================================================================
; Laravel Queue Worker
; Processes background jobs (notifications, analytics, status transitions)
; =============================================================================
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/tajiri/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/tajiri/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60
; Graceful restart on deploy
stopsignal=SIGTERM

; =============================================================================
; Laravel Scheduler
; Runs scheduled tasks (stream transitions, analytics generation)
; =============================================================================
[program:laravel-schedule]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do php /var/www/html/tajiri/artisan schedule:run --verbose --no-interaction >> /var/log/tajiri/schedule.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/tajiri/schedule.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

; =============================================================================
; WebSocket Server (Plain WebSocket for Livestreaming)
; Handles real-time communication for streams
; =============================================================================
[program:websocket-server]
process_name=%(program_name)s
command=php /var/www/html/tajiri/artisan websocket:serve --port=6001
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/tajiri/websocket.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10
; Higher priority to ensure it starts before workers
priority=100

; =============================================================================
; Stream Health Monitor (Optional)
; Background process for monitoring active stream health
; =============================================================================
[program:stream-health-monitor]
process_name=%(program_name)s
command=php /var/www/html/tajiri/artisan stream:health-monitor
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/tajiri/health-monitor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
; Lower priority - start after other services
priority=999

; =============================================================================
; Laravel Horizon (Alternative to laravel-worker - if using Horizon)
; Uncomment if using Laravel Horizon for queue management
; =============================================================================
; [program:laravel-horizon]
; process_name=%(program_name)s
; command=php /var/www/html/tajiri/artisan horizon
; autostart=true
; autorestart=true
; user=www-data
; numprocs=1
; redirect_stderr=true
; stdout_logfile=/var/log/tajiri/horizon.log
; stdout_logfile_maxbytes=10MB
; stdout_logfile_backups=5
; stopwaitsecs=3600

; =============================================================================
; Redis Server (if not using system redis)
; Uncomment if running Redis via supervisor
; =============================================================================
; [program:redis]
; command=/usr/bin/redis-server /etc/redis/redis.conf
; autostart=true
; autorestart=true
; user=redis
; stdout_logfile=/var/log/redis/redis.log
; priority=10
