# nginx-rtmp-module configuration for TAJIRI Livestreaming
# Place this in /etc/nginx/nginx.conf or include from main config
#
# Requirements:
# - nginx compiled with nginx-rtmp-module
# - Install: apt install libnginx-mod-rtmp (Ubuntu) or compile from source
#
# Usage:
# 1. Copy to /etc/nginx/rtmp.conf
# 2. In main nginx.conf add: include /etc/nginx/rtmp.conf;
# 3. Restart nginx: systemctl restart nginx

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Ping interval for keeping connections alive
        ping 30s;
        notify_method get;

        application live {
            live on;
            record off;

            # Authentication callback
            # nginx-rtmp sends: name (stream key), addr (client IP), app (application)
            #
            # IMPORTANT: These must reach the Tajiri Laravel API.
            # The API runs on port 8003 (SSL). For internal callbacks, either:
            #   a) Add an internal non-SSL server block (recommended), or
            #   b) Use the port 443 path: http://127.0.0.1/tajiri/api/rtmp/auth
            #      (requires port 80 to serve Tajiri, not just redirect)
            #
            # Current setup: uses port 80 which may redirect. If callbacks fail,
            # add this server block to nginx:
            #   server {
            #       listen 127.0.0.1:9080;
            #       root /var/www/html/tajiri/public;
            #       location ~ \.php$ {
            #           fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            #           fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            #           include fastcgi_params;
            #       }
            #       location / { try_files $uri $uri/ /index.php?$query_string; }
            #   }
            # Then use: http://127.0.0.1:9080/api/rtmp/auth
            #
            on_publish http://127.0.0.1/api/rtmp/auth;

            # Stream start callback - triggers HLS transcoding
            on_publish_done http://127.0.0.1/api/rtmp/publish;

            # Stream end callback
            on_done http://127.0.0.1/api/rtmp/done;

            # HLS output configuration
            hls on;
            hls_path /var/www/html/tajiri/storage/app/public/hls;
            hls_fragment 2s;
            hls_playlist_length 60s;

            # Cleanup HLS files 1 hour after stream ends
            hls_cleanup on;

            # Enable HLS for viewers with adaptive bitrate
            hls_nested on;
            hls_variant _low BANDWIDTH=500000;
            hls_variant _mid BANDWIDTH=1500000;
            hls_variant _high BANDWIDTH=4000000;

            # Drop idle connections after 30 seconds
            drop_idle_publisher 30s;

            # Interleave audio/video for smoother playback
            interleave on;

            # Wait for key frame before sending to new subscriber
            wait_key on;
            wait_video on;

            # Maximum number of connections (prevent DoS)
            max_connections 1000;

            # Allow publishing only from localhost and specific IPs
            # Uncomment and adjust for production
            # allow publish 127.0.0.1;
            # allow publish 192.168.0.0/16;
            # deny publish all;

            # Allow anyone to play
            allow play all;
        }

        # Optional: Recording application
        application record {
            live on;
            record all;
            record_path /var/www/html/tajiri/storage/app/recordings;
            record_suffix -%Y%m%d-%H%M%S.flv;
            record_unique on;
            record_max_size 2048M;

            on_publish http://127.0.0.1/api/rtmp/auth;
            on_done http://127.0.0.1/api/rtmp/done;
        }
    }
}

# HTTP server for HLS delivery
# Add to existing http {} block or include separately
http {
    server {
        listen 80;

        # HLS delivery
        location /hls {
            # Disable cache for live streaming
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;

            # CORS headers for HLS.js
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            # MIME types for HLS
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            root /var/www/html/tajiri/storage/app/public;
        }

        # RTMP statistics (optional, for monitoring)
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /var/www/html/tajiri/public;
        }
    }
}
