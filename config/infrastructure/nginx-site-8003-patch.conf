# PATCH for /etc/nginx/sites-available/zima-uat.site
# ================================================================
# Add these location blocks INSIDE the "Port 8003 - Tajiri API" server block.
# Place them AFTER the /app WebSocket proxy and BEFORE the "location /" block.
#
# FIXES:
#   1. ExoPlayer 404 → HLS files now served on port 8003
#   2. WebSocket "not upgraded" → see notes below
#
# After patching: sudo nginx -t && sudo systemctl reload nginx
# ================================================================

    # ========== FIX: HLS STREAMING on port 8003 ==========
    #
    # The mobile app sends HLS requests to port 8003 (same as the API).
    # Without this block, /hls/* requests fall through to Laravel → 404.
    #
    location /hls {
        alias /var/www/html/tajiri/storage/app/public/hls;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # CORS headers for mobile/web players
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range, Origin, Accept' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            add_header Content-Type 'text/plain charset=UTF-8';
            return 204;
        }

        # Enable range requests (needed for ExoPlayer seek)
        add_header Accept-Ranges bytes always;

        # M3U8 playlists — never cache (live content changes every fragment)
        location ~ \.m3u8$ {
            add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
            add_header Pragma 'no-cache' always;
            add_header Expires '0' always;
            add_header Access-Control-Allow-Origin * always;
        }

        # TS segments — cache for 1 hour (immutable once created)
        location ~ \.ts$ {
            add_header Cache-Control 'public, max-age=3600, immutable' always;
            add_header Access-Control-Allow-Origin * always;
        }
    }

    # ========== NOTE: WebSocket "Connection not upgraded" ==========
    #
    # The Flutter app connects to:
    #   wss://zima-uat.site:8003/streams/10?user_id=4
    #
    # This path is NOT a WebSocket endpoint — it's a Laravel API route.
    # Nginx correctly does NOT upgrade it to WebSocket.
    #
    # SOLUTION (app-side change required):
    # The app must connect to Reverb's Pusher-compatible WebSocket:
    #   wss://zima-uat.site:8003/app/{REVERB_APP_KEY}
    # Then subscribe to channel "stream.{streamId}" using Pusher protocol.
    #
    # The API now returns the correct WebSocket URL in:
    #   - POST /api/streams/{id}/join → response.websocket.url
    #   - GET  /api/streams/{id}      → response.websocket.url
    #   - GET  /api/streams/{id}/check → response.websocket.url
    #
    # The existing /app proxy in the port 8003 block already handles this:
    #   location /app {
    #       proxy_pass http://127.0.0.1:6002;
    #       ...WebSocket upgrade headers...
    #   }
    #
    # So the only app-side change needed is:
    #   OLD: wss://zima-uat.site:8003/streams/10?user_id=4
    #   NEW: wss://zima-uat.site:8003/app/tajiri-reverb-key-2026
    #        then subscribe to channel "stream.10"
